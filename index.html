<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>MyTunes</title>
<style>
/* ============ Темы и токены ============ */
:root{--bg:#121212;--p1:#181818;--p2:#282828;--p3:#3e3e3e;--tx:#fff;--tx2:#b3b3b3;--ac:#1DB954;--acTx:#000;--hdr:#3a3a3a;--r:8px;
  font-family:Inter,system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;color-scheme:dark}
:root[data-theme=light]{--bg:#f5f5f5;--p1:#fff;--p2:#e9e9e9;--p3:#d4d4d4;--tx:#111;--tx2:#555;color-scheme:light}
*{box-sizing:border-box}
html,body{margin:0;height:100%;background:var(--bg);color:var(--tx);overflow:hidden}
button{font:inherit;color:inherit;background:none;border:0;cursor:pointer}
button:focus-visible,a:focus-visible,input:focus-visible,select:focus-visible,[tabindex]:focus-visible{outline:2px solid var(--ac);outline-offset:2px}
input,select{font:inherit;color:var(--tx)}
svg{width:20px;height:20px;fill:currentColor;flex:none}
::-webkit-scrollbar{width:12px}::-webkit-scrollbar-thumb{background:#ffffff30;border:3px solid transparent;background-clip:content-box;border-radius:8px}
::-webkit-scrollbar-thumb:hover{background-color:#ffffff60}::-webkit-scrollbar-track{background:transparent}
.muted{color:var(--tx2)}.sm{font-size:.85rem}
a{text-decoration:none}a:hover{text-decoration:underline;color:var(--tx)!important}.xfv{white-space:nowrap}
/* ============ Макет ============ */
#app{display:grid;grid-template-columns:300px 1fr;grid-template-rows:1fr 88px;gap:8px;height:100%;padding:8px}
#side{display:flex;flex-direction:column;gap:8px;min-height:0}
.box{background:var(--p1);border-radius:var(--r)}
nav.top{padding:12px}
.nav{display:flex;align-items:center;gap:16px;padding:10px 12px;border-radius:6px;color:var(--tx2);font-weight:700;width:100%;text-align:left}
.nav:hover,.nav.on{color:var(--tx)}
#libbox{flex:1;display:flex;flex-direction:column;min-height:0;padding:8px}
#libbox .hd{display:flex;align-items:center;justify-content:space-between;padding:4px 8px}
#pls{overflow:auto;flex:1;margin-top:8px}
.pl{display:flex;gap:12px;align-items:center;padding:8px;border-radius:6px;width:100%;text-align:left}
.pl:hover{background:var(--p2)}.pl.on{background:var(--p2)}
.pl .cv{width:48px;height:48px;border-radius:4px}
.cv{background:#333 center/cover no-repeat;flex:none}
.ib{width:32px;height:32px;display:grid;place-items:center;border-radius:50%;color:var(--tx2);transition:.15s}
.ib:hover{color:var(--tx);transform:scale(1.06)}.ib.on{color:var(--ac)}.ib.on::after{content:"";position:absolute}
.pill{padding:8px 16px;border-radius:999px;background:var(--p2);font-weight:600;font-size:.85rem}
.pill:hover{background:var(--p3)}.pill.on{background:var(--tx);color:var(--bg)}
.btn{padding:12px 28px;border-radius:999px;background:var(--ac);color:var(--acTx);font-weight:700;transition:.15s}
.btn:hover{transform:scale(1.04);filter:brightness(1.1)}
.btn.ghost{background:transparent;color:var(--tx);border:1px solid var(--tx2)}
#main{overflow:auto;position:relative;min-height:0}
.hdr{padding:72px 24px 24px;background:linear-gradient(var(--hdr),transparent);transition:background .6s;display:flex;gap:24px;align-items:flex-end}
.hdr .big{width:200px;height:200px;border-radius:6px;box-shadow:0 8px 40px #0008}
.hdr h1{font-size:clamp(2rem,6vw,4.5rem);margin:.1em 0;line-height:1;word-break:break-word}
.sec{padding:0 24px 24px}.sec h2{font-size:1.4rem;margin:24px 0 12px}
.toolbar{display:flex;gap:12px;align-items:center;padding:16px 24px;flex-wrap:wrap}
.play-big{width:56px;height:56px;border-radius:50%;background:var(--ac);color:var(--acTx);display:grid;place-items:center;transition:.15s}
.play-big:hover{transform:scale(1.06)}.play-big svg{width:24px;height:24px}
/* Карточки */
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(170px,1fr));gap:16px}
.card{background:var(--p1);padding:12px;border-radius:var(--r);transition:.25s;cursor:pointer;position:relative;text-align:left;width:100%}
#main .card{background:#ffffff08}.card:hover{background:var(--p2)!important;transform:translateY(-4px)}
.card .cv{width:100%;aspect-ratio:1;border-radius:6px;box-shadow:0 8px 24px #0006;position:relative}
.card .cv.round{border-radius:50%}
.card b{display:block;margin-top:10px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.card .muted{font-size:.85rem;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;display:block}
.card .fab{position:absolute;right:20px;top:calc(100% - 110px);opacity:0;transform:translateY(8px);transition:.25s;box-shadow:0 8px 16px #0008;width:48px;height:48px}
.card:hover .fab,.card:focus-within .fab{opacity:1;transform:none}
/* Список треков */
.tl{width:100%;border-collapse:collapse}
.row{display:grid;grid-template-columns:32px minmax(0,4fr) minmax(0,3fr) 92px minmax(0,1.4fr) 60px 40px;gap:16px;align-items:center;padding:6px 16px;border-radius:6px;color:var(--tx2);cursor:default}
.row.head{border-bottom:1px solid var(--p3);border-radius:0;margin-bottom:8px;font-size:.85rem}
.row:not(.head):hover{background:#ffffff14}.row.sel{background:#ffffff24}
.row .n{text-align:right}.row:not(.head):hover .n span{display:none}.row .n button{display:none}.row:not(.head):hover .n button{display:inline-grid}
.row.playing .ti b,.row.playing .n{color:var(--ac)}
.ti{display:flex;gap:12px;align-items:center;min-width:0}.ti .cv{width:40px;height:40px;border-radius:4px}
.ti div{min-width:0}.ti b{color:var(--tx);font-weight:500;display:block}
.ell{white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.row .more{opacity:0}.row:hover .more,.row .more:focus{opacity:1}
/* Плеер */
#bar{grid-column:1/-1;display:grid;grid-template-columns:1fr 2fr 1fr;align-items:center;padding:0 8px;gap:8px}
.np{display:flex;gap:12px;align-items:center;min-width:0}.np .cv{width:56px;height:56px;border-radius:4px;cursor:pointer}
.np .t{min-width:0}.np b{display:block;font-size:.9rem}
.ctrl{display:flex;flex-direction:column;align-items:center;gap:6px;max-width:720px;width:100%;justify-self:center}
.btns{display:flex;gap:16px;align-items:center}
.pp{width:36px;height:36px;border-radius:50%;background:var(--tx);color:var(--bg);display:grid;place-items:center;transition:.1s}
.pp:hover{transform:scale(1.06)}
.prog{display:flex;align-items:center;gap:8px;width:100%;font-size:.75rem;color:var(--tx2)}
.prog span{min-width:40px;text-align:center}
.right{display:flex;justify-content:flex-end;align-items:center;gap:4px}
.ib.rep1::after{content:"1";position:static;font-size:9px;font-weight:700;margin-left:-6px;margin-top:-10px}
/* Ползунки: зелёные при наведении */
input[type=range]{-webkit-appearance:none;appearance:none;background:transparent;width:100%;height:16px;cursor:pointer;--v:0%}
input[type=range]::-webkit-slider-runnable-track{height:4px;border-radius:2px;background:linear-gradient(to right,var(--tx) var(--v),#ffffff4d var(--v))}
input[type=range]:hover::-webkit-slider-runnable-track{background:linear-gradient(to right,var(--ac) var(--v),#ffffff4d var(--v))}
input[type=range]::-webkit-slider-thumb{-webkit-appearance:none;width:12px;height:12px;border-radius:50%;background:#fff;margin-top:-4px;opacity:0;box-shadow:0 2px 4px #0008}
input[type=range]:hover::-webkit-slider-thumb,input[type=range]:focus-visible::-webkit-slider-thumb{opacity:1}
input[type=range]::-moz-range-track{height:4px;border-radius:2px;background:#ffffff4d}
input[type=range]::-moz-range-progress{height:4px;border-radius:2px;background:var(--tx)}
input[type=range]:hover::-moz-range-progress{background:var(--ac)}
input[type=range]::-moz-range-thumb{width:12px;height:12px;border:0;border-radius:50%;background:#fff}
:root[data-theme=light] input[type=range]::-webkit-slider-runnable-track{background:linear-gradient(to right,var(--tx) var(--v),#0003 var(--v))}
#vol{width:100px}
/* Очередь */
#qp{position:fixed;right:8px;top:8px;bottom:104px;width:340px;background:var(--p1);border-radius:var(--r);z-index:20;display:none;flex-direction:column;box-shadow:0 0 40px #000a}
#qp.open{display:flex}#qp .hd{display:flex;justify-content:space-between;align-items:center;padding:16px}
#ql{overflow:auto;flex:1;padding:0 8px 16px}
.qi{display:flex;gap:10px;align-items:center;padding:6px 8px;border-radius:6px;cursor:grab}
.qi:hover{background:var(--p2)}.qi.cur b{color:var(--ac)}.qi.drag{opacity:.4}.qi.over{box-shadow:0 -2px 0 var(--ac)}
.qi .cv{width:40px;height:40px;border-radius:4px}
/* Drop-зона */
.drop{border:2px dashed var(--p3);border-radius:12px;padding:32px;text-align:center;transition:.2s}
.drop.hot,#dragmask.hot{border-color:var(--ac);background:#1db95414}
#dragmask{position:fixed;inset:0;z-index:50;display:none;place-items:center;background:#000a;border:4px dashed var(--ac);font-size:1.6rem;font-weight:700}
#dragmask.hot{display:grid}
/* Модалки, меню, тосты */
.modal{position:fixed;inset:0;background:#000b;display:grid;place-items:center;z-index:60}
.dlg{background:var(--p2);border-radius:12px;padding:24px;width:min(520px,94vw);max-height:90vh;overflow:auto}
.dlg h3{margin-top:0}
.form{display:grid;grid-template-columns:180px 1fr;gap:16px}
.form .cv{width:180px;height:180px;border-radius:6px;position:relative}
.fld{display:flex;flex-direction:column;gap:10px}
.fld input,.fld select,.inp{background:var(--p3);border:1px solid transparent;border-radius:4px;padding:10px 12px;width:100%}
.inp:focus{border-color:var(--tx2);outline:none}
.actions{display:flex;justify-content:flex-end;gap:8px;margin-top:20px}
#menu{position:fixed;z-index:70;background:var(--p2);border-radius:6px;padding:4px;min-width:220px;box-shadow:0 16px 24px #000a;display:none}
#menu button{display:block;width:100%;text-align:left;padding:10px 12px;border-radius:3px;font-size:.9rem}
#menu button:hover,#menu button:focus{background:var(--p3);outline:none}
#menu hr{border:0;border-top:1px solid var(--p3);margin:4px}
#toasts{position:fixed;bottom:110px;left:50%;transform:translateX(-50%);display:flex;flex-direction:column;gap:8px;z-index:80;align-items:center}
.toast{background:#2e77d0;color:#fff;padding:10px 18px;border-radius:8px;font-size:.9rem;animation:tin .25s;box-shadow:0 8px 20px #0008}
.toast.err{background:#c0392b}
@keyframes tin{from{opacity:0;transform:translateY(10px)}}
.skel{background:linear-gradient(90deg,var(--p2),var(--p3),var(--p2));background-size:200% 100%;animation:sk 1.2s infinite;border-radius:6px}
@keyframes sk{to{background-position:-200% 0}}
.empty{text-align:center;padding:64px 24px;color:var(--tx2)}.empty svg{width:64px;height:64px;margin-bottom:12px}
.empty h3{color:var(--tx);font-size:1.5rem}
/* Полноэкранный «Сейчас играет» */
#full{position:fixed;inset:0;z-index:40;background:var(--bg);display:none;overflow:auto}
#full.open{display:block}
#full .bg{position:absolute;inset:0;background:linear-gradient(var(--hdr),var(--bg) 70%);z-index:-1}
#full .wrap{max-width:1000px;margin:auto;padding:24px;display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr);gap:32px;align-items:center;min-height:100%}
#fcv{width:100%;aspect-ratio:1;border-radius:8px;box-shadow:0 16px 60px #000a}
#viz{width:100%;height:120px;display:block;margin-top:16px}
.eq{display:flex;gap:8px;justify-content:space-between;margin-top:12px}
.eq label{display:flex;flex-direction:column;align-items:center;font-size:.7rem;color:var(--tx2);gap:4px}
.eq input{writing-mode:vertical-lr;direction:rtl;width:16px;height:110px}
.eq input::-webkit-slider-runnable-track{width:4px;height:auto!important;background:#ffffff4d!important}
.eq input::-webkit-slider-thumb{opacity:1!important;margin-top:0;margin-left:-4px}
#full .ctrl{max-width:none}#full .btns{justify-content:center}
#tabs{display:none}
.search{display:flex;align-items:center;gap:8px;background:var(--p2);border-radius:999px;padding:10px 16px;max-width:420px}
.search input{background:none;border:0;outline:none;flex:1;font-size:1rem}
.search:focus-within{outline:2px solid var(--tx)}
.chips{display:flex;gap:8px;flex-wrap:wrap}
.set{display:grid;gap:16px;max-width:640px}
.set .line{display:flex;align-items:center;justify-content:space-between;gap:16px;background:var(--p1);padding:16px;border-radius:8px}
.sw{width:28px;height:28px;border-radius:50%;border:2px solid transparent}.sw.on{border-color:var(--tx)}
.bar{height:8px;background:var(--p3);border-radius:4px;overflow:hidden}.bar i{display:block;height:100%;background:var(--ac)}
/* ============ Мобильная версия ============ */
@media (max-width:768px){
  #app{grid-template-columns:1fr;grid-template-rows:1fr 64px 60px;padding:0;gap:0}
  #side{display:none}#main{border-radius:0}
  #bar{grid-template-columns:1fr auto;margin:0 8px;background:var(--p2);border-radius:8px;padding:4px 8px;position:relative}
  #bar .ctrl .prog,#bar .right,#bar .btns .ib{display:none}
  #bar .ctrl{width:auto}#bar .np .cv{width:44px;height:44px}
  #bar .np .like{display:none}
  #tabs{display:flex;justify-content:space-around;align-items:center;background:linear-gradient(transparent,var(--bg) 40%)}
  #tabs button{display:flex;flex-direction:column;align-items:center;font-size:.7rem;color:var(--tx2);gap:2px;padding:6px 12px}
  #tabs button.on{color:var(--tx)}
  .row{grid-template-columns:minmax(0,1fr) 40px}.row>:not(.ti):not(.mc){display:none}
  .row .more{opacity:1}
  .hdr{padding:48px 16px 16px;flex-direction:column;align-items:flex-start}.hdr .big{width:160px;height:160px}
  .sec{padding:0 16px 16px}.toolbar{padding:12px 16px}
  .grid{grid-template-columns:repeat(auto-fill,minmax(140px,1fr));gap:12px}
  #full .wrap{grid-template-columns:1fr;gap:16px}
  #full #fcv{max-width:340px;margin:auto}
  #full .ctrl .prog,#full .btns .ib{display:flex}
  #qp{left:0;right:0;top:0;bottom:0;width:auto;border-radius:0;z-index:45}
  .form{grid-template-columns:1fr}.form .cv{margin:auto}
  #toasts{bottom:140px}
}
#mprog{display:none}
@media (max-width:768px){#mprog{display:block;position:absolute;left:8px;right:8px;bottom:0;height:2px;background:#ffffff30;border-radius:2px;overflow:hidden}#mprog i{display:block;height:100%;background:var(--tx);width:0}}
.tiles{display:grid;grid-template-columns:repeat(auto-fill,minmax(160px,1fr));gap:12px}
.tile{background:#ffffff0d;border-radius:var(--r);padding:16px}.tile b{display:block;font-size:2rem;line-height:1.1}.tile span{color:var(--tx2);font-size:.85rem}
.bars{display:flex;align-items:flex-end;gap:4px;height:140px;padding-top:8px}.bars div{flex:1;display:flex;flex-direction:column;align-items:center;gap:4px;height:100%;justify-content:flex-end;min-width:0}
.bars i{display:block;width:100%;background:var(--ac);border-radius:3px 3px 0 0;min-height:2px}.bars span{font-size:.7rem;color:var(--tx2);white-space:nowrap;height:1em}
.cols2{display:grid;grid-template-columns:1fr 1fr;gap:24px}@media (max-width:900px){.cols2{grid-template-columns:1fr}}
.trow{display:flex;align-items:center;gap:12px;padding:6px 8px;border-radius:6px;cursor:pointer;width:100%;text-align:left}.trow:hover{background:#ffffff14}
.trow .n{width:22px;text-align:right;color:var(--tx2);font-variant-numeric:tabular-nums;flex:none}.trow .cv{width:44px;height:44px;border-radius:4px;flex:none;background-size:cover;background-position:center}.trow .r{margin-left:auto;color:var(--tx2);font-size:.85rem;white-space:nowrap}
.wbanner{display:flex;align-items:center;gap:16px;padding:20px 24px;border-radius:12px;background:linear-gradient(120deg,#ff2e93,#8338ec 55%,#3a86ff);color:#fff;width:100%;text-align:left;margin-top:8px}
.wbanner b{font-size:1.5rem}.wbanner:hover{filter:brightness(1.1)}
.wr{padding:0 24px 24px;display:grid;gap:16px}.ws{border-radius:16px;padding:40px 32px;color:#fff;min-height:300px;display:flex;flex-direction:column;justify-content:center;position:relative;overflow:hidden}
.ws h2{font-size:clamp(1.6rem,4vw,2.6rem);margin:0 0 8px;line-height:1.1}.ws .big{font-size:clamp(3rem,12vw,7rem);font-weight:900;line-height:1;letter-spacing:-.03em}
.ws p{font-size:1.1rem;opacity:.92;margin:8px 0}.ws .trow{color:#fff}.ws .trow .r,.ws .trow .n,.ws .trow .muted{color:#ffffffc0}.ws .trow:hover{background:#ffffff22}
.ws .acv{width:180px;height:180px;border-radius:50%;box-shadow:0 12px 40px #0007;margin-bottom:16px;background-size:cover;background-position:center}
.ws.in{animation:wsIn .6s both}@keyframes wsIn{from{opacity:0;transform:translateY(24px)}}
@media (prefers-reduced-motion:reduce){*{transition:none!important;animation:none!important}}
/* Оценки */
.stars{display:inline-flex;flex-direction:row-reverse;justify-content:flex-end;gap:1px;line-height:1}
.stars button{width:18px;height:20px;padding:0;font-size:15px;color:var(--tx2);opacity:.45;transition:color .15s,opacity .15s}
.stars button.f{color:var(--ac);opacity:1}
.stars button:hover,.stars button:hover~button{color:var(--ac);opacity:1}
.row .stars:not(.has){opacity:0}.row:hover .stars,.row .stars:focus-within{opacity:1}
#fStars{margin-top:6px}#fStars .stars button{width:24px;height:26px;font-size:20px}
/* Текст песни */
#lyr{position:relative;width:100%;aspect-ratio:1;border-radius:8px;background:#0000003d;overflow:auto;padding:28px 24px 8px;display:none;overscroll-behavior:contain}
#full.lyr #lyr{display:block}#full.lyr #fcv{display:none}
#lyr p{font-size:1.45rem;font-weight:800;margin:0 0 14px;color:var(--tx);opacity:.42;cursor:pointer;transition:opacity .25s,transform .25s;line-height:1.3;transform-origin:left center}
#lyr p:hover{opacity:.8}#lyr p.past{opacity:.62}#lyr p.on{opacity:1;transform:scale(1.03)}
#lyr.plain p{cursor:text;opacity:.9;font-size:1.1rem;font-weight:600;margin:0 0 6px;transform:none}
#lyr .lyrE{display:flex;flex-direction:column;align-items:center;justify-content:center;min-height:100%;text-align:center;gap:10px;padding-bottom:20px}
#lyr .lyrE p{font-size:.9rem;font-weight:400;opacity:1;cursor:default;margin:0;color:var(--tx2)}
.lyrBar{position:sticky;bottom:-8px;margin:0 -24px;padding:12px 24px 10px!important;background:#0000009c;backdrop-filter:blur(12px);display:flex;gap:6px;align-items:center;justify-content:flex-end;flex-wrap:wrap;padding:10px 0 4px;font-size:.8rem;color:var(--tx2)}
.lyrBar .pill{padding:4px 10px;font-size:.8rem}
@media (max-width:768px){#lyr{aspect-ratio:auto;height:54vh}}
/* Баннер обновления */
#upd{position:fixed;left:50%;bottom:104px;transform:translateX(-50%);z-index:60;background:var(--p2);color:var(--tx);display:flex;gap:12px;align-items:center;padding:8px 8px 8px 16px;border-radius:12px;box-shadow:0 10px 40px #0009;max-width:calc(100% - 32px)}
#upd .btn{padding:8px 16px}
.card .cvi{display:grid;place-items:center;height:100%}.card .cvi svg{width:38%;height:38%;color:#fff;fill:#fff;opacity:.9}
.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0)}
</style>
</head>
<body>
<div id="app">
  <aside id="side" aria-label="Боковая панель">
    <nav class="box top" aria-label="Основная навигация">
      <div style="display:flex;align-items:center;gap:8px;padding:4px 12px 12px;font-weight:800;font-size:1.25rem"><span style="color:var(--ac)" data-i="logo"></span>MyTunes</div>
      <button class="nav" data-go="home"><span data-i="home"></span>Главная</button>
      <button class="nav" data-go="search"><span data-i="search"></span>Поиск</button>
      <button class="nav" data-go="stats"><span data-i="chart"></span>Статистика</button>
      <button class="nav" data-go="settings"><span data-i="gear"></span>Настройки</button>
    </nav>
    <section class="box" id="libbox" aria-label="Моя медиатека">
      <div class="hd">
        <button class="nav" data-go="library" style="padding:8px 4px;width:auto"><span data-i="lib"></span>Моя медиатека</button>
        <div><button class="ib" id="newPl" aria-label="Создать плейлист" title="Создать плейлист"><span data-i="plus"></span></button></div>
      </div>
      <div class="chips" style="padding:0 8px">
        <button class="pill" data-go="artists">Исполнители</button><button class="pill" data-go="albums">Альбомы</button>
      </div>
      <div id="pls" role="list"></div>
      <button class="btn" id="upBtn" style="margin:8px"><span>Загрузить треки</span></button>
    </section>
  </aside>
  <main id="main" class="box" tabindex="-1"></main>
  <footer id="bar" aria-label="Плеер">
    <div class="np">

  async read(file) {
    const out = {};

      const head = new DataView(await file.slice(0, 10).arrayBuffer());
      if (head.byteLength < 10) return out;

  /* → { synced, lines: [{ t, text }] } или null */
  parse(raw) {
    if (!raw || !String(raw).trim()) return null; let off = 0; const L = [], plain = [];
    for (const line of String(raw).replace(/\r/g, '').split('\n')) {
      const mo = line.match(/^\s*\[offset:\s*([+-]?\d+)\s*\]/i); if (mo) { off = +mo[1] / 1000; continue; }

      if (tags.length) { const text = line.replace(/\[[^\]]*\]/g, '').replace(/<\d+:\d+(?:[.:]\d+)?>/g, '').trim();

    if (L.length) { L.sort((a, b) => a.t - b.t); while (L.length && !L[L.length - 1].text) L.pop(); return { synced: true, lines: L }; }
    const txt = plain.join('\n').trim(); return txt ? { synced: false, lines: txt.split('\n').map(text => ({ t: null, text })) } : null;

  async ensure(t) {

      if (t.album && t.album !== 'Без альбома') q.set('album_name', t.album); if (t.duration) q.set('duration', Math.round(t.duration));
      const r = await fetch('https://lrclib.net/api/get?' + q); if (r.ok) { const d = await r.json(); if (d.syncedLyrics || d.plainLyrics) return d.syncedLyrics || d.plainLyrics; } }
    const r = await fetch('https://lrclib.net/api/search?' + new URLSearchParams(known ? { track_name: t.title, artist_name: t.artist } : { q: t.title }));
    if (!r.ok) throw new Error(r.status); const arr = await r.json();

    const d = arr.find(x => x.syncedLyrics && close(x)) || arr.find(x => x.plainLyrics && close(x)) || arr.find(x => x.syncedLyrics || x.plainLyrics);

};

/* =====================================================================
   Zip — чтение ZIP-архивов без библиотек (stored и deflate через DecompressionStream)
   ===================================================================== */
const Zip = {
  async extract(file) {
    const tailLen = Math.min(file.size, 65557);
    const tail = new DataView(await file.slice(file.size - tailLen).arrayBuffer());
    let eocd = -1; for (let i = tailLen - 22; i >= 0; i--) if (tail.getUint32(i, true) === 0x06054b50) { eocd = i; break; }
    if (eocd < 0) throw new Error('not a zip');
    let count = tail.getUint16(eocd + 10, true), cdSize = tail.getUint32(eocd + 12, true), cdOff = tail.getUint32(eocd + 16, true);
    if (cdOff === 0xffffffff || count === 0xffff) { // ZIP64
      const loc = eocd - 20; if (loc < 0 || tail.getUint32(loc, true) !== 0x07064b50) throw new Error('zip64');
      const z64 = new DataView(await file.slice(Number(tail.getBigUint64(loc + 8, true)), Number(tail.getBigUint64(loc + 8, true)) + 56).arrayBuffer());
      count = Number(z64.getBigUint64(32, true)); cdSize = Number(z64.getBigUint64(40, true)); cdOff = Number(z64.getBigUint64(48, true));
    }
    const cd = new DataView(await file.slice(cdOff, cdOff + cdSize).arrayBuffer()); const u8 = new Uint8Array(cd.buffer);
    const out = []; let p = 0;
    for (let n = 0; n < count && p + 46 <= cd.byteLength; n++) {
      if (cd.getUint32(p, true) !== 0x02014b50) break;
      const flags = cd.getUint16(p + 8, true), method = cd.getUint16(p + 10, true);
      let comp = cd.getUint32(p + 20, true), size = cd.getUint32(p + 24, true);
      const nl = cd.getUint16(p + 28, true), xl = cd.getUint16(p + 30, true), cl = cd.getUint16(p + 32, true);
      let off = cd.getUint32(p + 42, true);
      const nameBytes = u8.subarray(p + 46, p + 46 + nl);
      // расширенные поля ZIP64
      for (let q = p + 46 + nl; q + 4 <= p + 46 + nl + xl;) { const id = cd.getUint16(q, true), len = cd.getUint16(q + 2, true);
        if (id === 1) { let r = q + 4; if (size === 0xffffffff) { size = Number(cd.getBigUint64(r, true)); r += 8; }
          if (comp === 0xffffffff) { comp = Number(cd.getBigUint64(r, true)); r += 8; } if (off === 0xffffffff) off = Number(cd.getBigUint64(r, true)); }
        q += 4 + len; }
      p += 46 + nl + xl + cl;
      const name = new TextDecoder(flags & 0x800 ? 'utf-8' : 'ibm866').decode(nameBytes);
      const base = name.split('/').pop(), ext = base.split('.').pop().toLowerCase();
      if (!base || !(AUDIO_EXT.includes(ext) || ext === 'lrc') || base.startsWith('._')) continue;
      if (flags & 1) { toast(`Зашифрованный файл в архиве пропущен: ${base}`, 1); continue; }
      out.push({ base, ext, method, comp, off });
    }
    // файлы распаковываются лениво — по одному, при обработке
    const mime = x => x === 'lrc' ? 'text/plain' : 'audio/' + (x === 'mp3' ? 'mpeg' : x);
    return out.map(e => ({ name: e.base, size: e.comp, type: mime(e.ext), lazy: async () => {
      const lh = new DataView(await file.slice(e.off, e.off + 30).arrayBuffer());
      const start = e.off + 30 + lh.getUint16(26, true) + lh.getUint16(28, true); const raw = file.slice(start, start + e.comp);
      let blob = e.method === 0 ? raw : e.method === 8 ? await new Response(raw.stream().pipeThrough(new DecompressionStream('deflate-raw'))).blob() : null;
      if (!blob) throw new Error('method ' + e.method);
      return new File([blob], e.base, { type: mime(e.ext) });
    } }));
  },
};

/* =====================================================================
   Storage — IndexedDB: tracks (метаданные + обложка), files (аудио), playlists
   ===================================================================== */
const Storage = {
  db: null,
  open() {
    return new Promise((res, rej) => {
      const r = indexedDB.open('mytunes', 1);
      r.onupgradeneeded = () => { const d = r.result;
        d.createObjectStore('tracks', { keyPath: 'id' }); d.createObjectStore('files'); d.createObjectStore('playlists', { keyPath: 'id' }); };
      r.onsuccess = () => { this.db = r.result; res(); }; r.onerror = () => rej(r.error);
    });
  },
  tx(store, mode, fn) {
    return new Promise((res, rej) => {
      const t = this.db.transaction(store, mode); let out;
      const r = fn(t); if (r && 'onsuccess' in r) r.onsuccess = () => out = r.result;
      t.oncomplete = () => res(out); t.onerror = t.onabort = () => rej(t.error || r?.error);
    });
  },
  all(s) { return this.tx(s, 'readonly', t => t.objectStore(s).getAll()); },
  put(s, v, k) { return this.tx(s, 'readwrite', t => t.objectStore(s).put(v, k)); },
  del(s, k) { return this.tx(s, 'readwrite', t => t.objectStore(s).delete(k)); },
  getFile(id) { return this.tx('files', 'readonly', t => t.objectStore('files').get(id)); },
  /* Трек и файл пишутся одной транзакцией, чтобы не было «полутреков» */
  addTrack(track, blob) {
    return new Promise((res, rej) => {
      const t = this.db.transaction(['tracks', 'files'], 'readwrite');
      t.objectStore('files').put(blob, track.id); t.objectStore('tracks').put(track);
      t.oncomplete = res; t.onerror = t.onabort = () => rej(t.error);
    });
  },
  async usage() { try { return await navigator.storage.estimate(); } catch { return null; } },
};

/* =====================================================================
   Library — треки, плейлисты, лайки, история
   ===================================================================== */
const Library = {
  tracks: new Map(), playlists: [], liked: LS.get('liked', []), recent: LS.get('recent', []),
  async load() {
    (await Storage.all('tracks')).forEach(t => this.tracks.set(t.id, t));
    this.playlists = (await Storage.all('playlists')).sort((a, b) => a.created - b.created);
    this.liked = this.liked.filter(id => this.tracks.has(id));
  },
  list() { return [...this.tracks.values()]; },
  get(id) { return this.tracks.get(id); },
  /* Импорт файлов: проверка формата, теги, длительность, запись в БД */
  async addFiles(files) {
    files = [...files]; if (!files.length) return;
    // ZIP-архивы распаковываем и берём из них аудиофайлы
    const flat = [];
    for (const f of files) {
      if (/\.zip$/i.test(f.name)) {
        try { UI.busy(true, 'распаковка ' + f.name); const got = await Zip.extract(f);
          if (!got.length) toast(`В архиве ${f.name} нет аудиофайлов`, 1); flat.push(...got); }
        catch (e) { console.error(e); toast(`Не удалось распаковать ${f.name}`, 1); }
      } else flat.push(f);
    }
    // .lrc сопоставляем с аудио по имени файла
    const lrcs = new Map(), added = [];
    files = flat.filter(f => { if (/\.lrc$/i.test(f.name)) { lrcs.set(baseName(f.name), f); return false; } return true; });
    const readText = async f => (f.lazy ? await f.lazy() : f).text();
    const attachLeft = async () => { let n = 0; if (!lrcs.size) return;
      for (const [b, f] of lrcs) { const t = this.list().find(x => baseName(x.fileName) === b) || this.list().find(x => (x.artist + ' - ' + x.title).toLowerCase() === b);
        if (!t) continue; try { t.lyrics = await readText(f); await this.update(t); n++; } catch {} }
      if (n) toast(`Тексты песен добавлены: ${n}`); else if (!files.length) toast('Не нашлось треков с такими же именами, как у .lrc', 1);
      if (n && Player.track) UI.renderLyrics(true); };
    if (!files.length) { UI.busy(false); await attachLeft(); return added; }
    let ok = 0, bad = 0; UI.busy(true, files.length);
    for (let f of files) {
      if (f.lazy) { try { f = await f.lazy(); } catch (e) { bad++; toast(`Не удалось извлечь ${f.name} из архива`, 1); continue; } }
      const ext = f.name.split('.').pop().toLowerCase();
      if (!AUDIO_EXT.includes(ext) && !/^audio\//.test(f.type)) { bad++; toast(`Неподдерживаемый формат: ${f.name}`, 1); continue; }
      try {
        const dur = await Tags.duration(f);
        if (dur === null) { bad++; toast(`Файл повреждён или не воспроизводится: ${f.name}`, 1); continue; }
        const tags = await Tags.read(f), byName = Tags.fromName(f.name);
        const t = { id: uid(), title: tags.title || byName.title, artist: tags.artist || byName.artist || 'Неизвестный исполнитель',
          album: tags.album || 'Без альбома', year: tags.year || '', duration: dur, cover: tags.cover || null,
          size: f.size, mime: f.type, fileName: f.name, added: Date.now(), plays: 0, lyrics: tags.lyrics || '' };
        const lf = lrcs.get(baseName(f.name)); if (lf) { try { t.lyrics = await readText(lf); } catch {} lrcs.delete(baseName(f.name)); }
        await Storage.addTrack(t, f); this.tracks.set(t.id, t); ok++; added.push(t.id);
        UI.busy(true, files.length - ok - bad);
      } catch (e) {
        bad++; console.error(e);
        if (e && e.name === 'QuotaExceededError') { toast('Хранилище переполнено — освободите место', 1); break; }
        toast(`Ошибка при добавлении ${f.name}`, 1);
      }
    }
    UI.busy(false);
    if (ok) toast(`Добавлено треков: ${ok}`);
    await attachLeft(); UI.refresh(); return added;
  },
  /* Оценка 1–5 (повторное нажатие той же оценки снимает её) */
  async rate(id, r) {
    const t = this.get(id); if (!t) return; t.rating = r && t.rating === r ? 0 : r; await this.update(t);
    toast(t.rating ? `Оценка «${t.title}»: ${'★'.repeat(t.rating)}${'☆'.repeat(5 - t.rating)}` : 'Оценка снята'); UI.refresh(true);
  },
  async update(t) { await Storage.put('tracks', t); this.tracks.set(t.id, t); colorCache.delete(t.id); },
  async remove(id) {
    await Storage.del('tracks', id); await Storage.del('files', id); this.tracks.delete(id); dropCoverURL(id);
    this.liked = this.liked.filter(x => x !== id); LS.set('liked', this.liked);
    for (const p of this.playlists) if (p.tracks.includes(id)) { p.tracks = p.tracks.filter(x => x !== id); await Storage.put('playlists', p); }

  },
  isLiked(id) { return this.liked.includes(id); },
  toggleLike(id) {
    if (!id) return; const on = !this.isLiked(id);
    this.liked = on ? [id, ...this.liked] : this.liked.filter(x => x !== id); LS.set('liked', this.liked);
    toast(on ? 'Добавлено в «Любимые треки»' : 'Удалено из «Любимых треков»'); UI.refresh(true);
  },
  pushRecent(id) { this.recent = [id, ...this.recent.filter(x => x !== id)].slice(0, 30); LS.set('recent', this.recent); },
  async createPlaylist(name = `Мой плейлист №${this.playlists.length + 1}`, tracks = []) {
    const p = { id: uid(), name, tracks, cover: null, created: Date.now() }; await Storage.put('playlists', p); this.playlists.push(p); UI.refresh(); return p;
  },
  pl(id) { return this.playlists.find(p => p.id === id); },
  async savePl(p) { await Storage.put('playlists', p); UI.refresh(true); },
  async removePl(id) { await Storage.del('playlists', id); this.playlists = this.playlists.filter(p => p.id !== id); },
  artists() { const m = new Map(); this.list().forEach(t => { if (!m.has(t.artist)) m.set(t.artist, []); m.get(t.artist).push(t); }); return m; },
  albums() { const m = new Map(); this.list().forEach(t => { const k = t.album + '\u0001' + t.artist; if (!m.has(k)) m.set(k, []); m.get(k).push(t); }); return m; },
  search(q) {
    q = q.toLowerCase().trim(); if (!q) return null;
    const hit = s => String(s).toLowerCase().includes(q);
    const tracks = this.list().filter(t => hit(t.title) || hit(t.artist) || hit(t.album));
    return { tracks, artists: [...this.artists().keys()].filter(hit), albums: [...this.albums().entries()].filter(([k, v]) => hit(v[0].album)) };
  },
  /* Экспорт метаданных и плейлистов в JSON (без аудио) */
  exportJSON() {
    const data = { app: 'MyTunes', version: 1, exported: new Date().toISOString(),
      tracks: this.list().map(({ cover, ...t }) => t), playlists: this.playlists.map(({ cover, ...p }) => p), liked: this.liked, log: Stats.all() };
    const a = document.createElement('a'); a.href = URL.createObjectURL(new Blob([JSON.stringify(data, null, 2)], { type: 'application/json' }));
    a.download = 'mytunes-library.json'; a.click(); setTimeout(() => URL.revokeObjectURL(a.href), 1000);
  },
  async importJSON(file) {
    try {
      const d = JSON.parse(await file.text()); if (d.app !== 'MyTunes') throw new Error('format');
      let n = 0; // сопоставляем по id, а если его нет — по имени файла
      const byName = new Map(this.list().map(t => [t.fileName, t]));
      const idMap = {};
      for (const m of d.tracks || []) { const t = this.get(m.id) || byName.get(m.fileName); if (!t) continue;
        idMap[m.id] = t.id; Object.assign(t, { title: m.title, artist: m.artist, album: m.album, year: m.year });
        if (m.rating != null) t.rating = m.rating; if (m.lyrics) t.lyrics = m.lyrics; if (m.lyrOff) t.lyrOff = m.lyrOff; if (m.skips) t.skips = m.skips; await this.update(t); n++; }
      for (const p of d.playlists || []) { const tr = (p.tracks || []).map(id => idMap[id]).filter(Boolean);
        await this.createPlaylist(p.name, tr); }
      this.liked = [...new Set([...this.liked, ...(d.liked || []).map(id => idMap[id]).filter(Boolean)])]; LS.set('liked', this.liked);
      if (Array.isArray(d.log)) { const seen = new Set(Stats.log.map(e => e.t + e.i));
        for (const e of d.log) { const m = { ...e, i: idMap[e.i] || e.i }; if (!seen.has(m.t + m.i)) Stats.log.push(m); } Stats.log.sort((x, y) => x.t - y.t); Stats.save(); }
      toast(`Импорт: обновлено треков ${n}, плейлистов ${(d.playlists || []).length}`); UI.refresh();
    } catch (e) { toast('Не удалось прочитать JSON медиатеки', 1); }
  },
};

/* =====================================================================
   Queue — порядок воспроизведения, shuffle, «играть следующим»
   ===================================================================== */
const Queue = {
  orig: [], list: [], i: -1, shuffle: LS.get('shuffle', false), repeat: LS.get('repeat', 'off'), // off|all|one
  set(ids, start = 0) {
    this.orig = [...ids]; this.list = [...ids]; this.i = start;
    if (this.shuffle) this.doShuffle(); this.save();
  },
  current() { return this.list[this.i]; },
  doShuffle() {
    const cur = this.current(), rest = this.list.filter((_, k) => k !== this.i);
    for (let k = rest.length - 1; k > 0; k--) { const j = Math.random() * (k + 1) | 0; [rest[k], rest[j]] = [rest[j], rest[k]]; }
    this.list = cur ? [cur, ...rest] : rest; this.i = cur ? 0 : -1;
  },
  toggleShuffle() {
    this.shuffle = !this.shuffle; LS.set('shuffle', this.shuffle);
    if (this.shuffle) this.doShuffle(); else { const c = this.current(); this.list = [...this.orig]; this.i = Math.max(0, this.list.indexOf(c)); }
    this.save(); UI.syncControls(); UI.renderQueue(); toast(this.shuffle ? 'Перемешивание включено' : 'Перемешивание выключено');
  },
  cycleRepeat() {
    this.repeat = { off: 'all', all: 'one', one: 'off' }[this.repeat]; LS.set('repeat', this.repeat); UI.syncControls();
    toast({ off: 'Повтор выключен', all: 'Повтор всего списка', one: 'Повтор одного трека' }[this.repeat]);
  },
  /* Индекс следующего трека (manual=true — нажата кнопка «вперёд», repeat-one игнорируется) */
  peek(manual) {
    if (!this.list.length) return -1;
    if (!manual && this.repeat === 'one') return this.i;
    if (this.i + 1 < this.list.length) return this.i + 1;
    return this.repeat === 'off' && !manual ? -1 : (this.repeat === 'off' ? -1 : 0);
  },
  add(id) { this.list.push(id); this.orig.push(id); if (this.i < 0) this.i = 0; this.save(); UI.renderQueue(); toast('Добавлено в очередь'); },
  playNext(id) {
    if (this.i < 0) return this.add(id);
    this.list.splice(this.i + 1, 0, id); const oi = this.orig.indexOf(this.current()); this.orig.splice(oi + 1, 0, id);
    this.save(); UI.renderQueue(); toast('Будет воспроизведено следующим');
  },
  move(from, to) {
    const cur = this.current(); const [x] = this.list.splice(from, 1); this.list.splice(to, 0, x);
    this.i = this.list.indexOf(cur); if (!this.shuffle) this.orig = [...this.list]; this.save(); UI.renderQueue();
  },
  removeId(id) {
    const cur = this.current(); this.list = this.list.filter(x => x !== id); this.orig = this.orig.filter(x => x !== id);
    this.i = this.list.indexOf(cur); if (this.i < 0 && this.list.length) this.i = 0; this.save();
  },
  save() { LS.set('queue', { orig: this.orig, list: this.list, i: this.i }); },
  restore() { const q = LS.get('queue'); if (!q) return;
    const ok = id => Library.tracks.has(id); const cur = q.list[q.i];
    this.orig = q.orig.filter(ok); this.list = q.list.filter(ok); this.i = Math.max(0, this.list.indexOf(cur)); if (!this.list.length) this.i = -1; },
};

/* =====================================================================
   Stats — журнал прослушиваний (localStorage) и агрегаты для статистики / итогов года
   ===================================================================== */
const Stats = {
  log: LS.get('log', []), cur: null, last: null, saved: 0,
  init() { const c = LS.get('logCur'); if (c && c.s >= 10) this.log.push(c); this.save();
    window.addEventListener('beforeunload', () => this.flush());
    document.addEventListener('visibilitychange', () => document.hidden && this.save()); },
  begin(t) { this.flush(); this.cur = { i: t.id, ti: t.title, a: t.artist, al: t.album, t: Date.now(), s: 0 }; this.last = null; this.saved = 0; },
  tick(el) { const c = this.cur; if (!c || el.paused) { this.last = null; return; }
    const ct = el.currentTime; if (this.last != null) { const d = ct - this.last; if (d > 0 && d < 2) c.s += d; } this.last = ct;
    if (c.s - this.saved > 15) { this.saved = c.s; LS.set('logCur', this.pack(c)); } },
  pack(c) { return { ...c, s: Math.round(c.s) }; },
  flush() { const c = this.cur; this.cur = null; if (c && c.s >= 10) this.log.push(this.pack(c)); this.save(); },
  save() { LS.set('log', this.log); LS.set('logCur', this.cur ? this.pack(this.cur) : null); },
  all() { return this.cur && this.cur.s >= 10 ? [...this.log, this.pack(this.cur)] : this.log; },
  years() { return [...new Set(this.all().map(e => new Date(e.t).getFullYear()))].sort((a, b) => b - a); },
  range(p) { const now = Date.now(), d = 864e5, E = this.all();
    if (p === 'week') return E.filter(e => e.t > now - 7 * d); if (p === 'month') return E.filter(e => e.t > now - 30 * d);
    if (/^\d{4}$/.test(p)) return E.filter(e => new Date(e.t).getFullYear() === +p); return E; },

            .map(([g, n, bg]) => `<button class="pl" data-go="${g}" style="background:#ffffff12;padding:0;overflow:hidden;gap:16px"><div class="cv" style="width:64px;height:64px;border-radius:0;background-image:${bg}"></div><b>${n}</b></button>`).join('')}

  cardsPage(title, items) {

  sortTracks(ts) {
    const s = this.sort, c = (a, b) => String(a).localeCompare(String(b), 'ru');
    return [...ts].sort({ title: (a, b) => c(a.title, b.title), artist: (a, b) => c(a.artist, b.artist) || c(a.title, b.title),
      added: (a, b) => b.added - a.added, duration: (a, b) => a.duration - b.duration, rating: (a, b) => (b.rating || 0) - (a.rating || 0) || c(a.title, b.title) }[s] || (() => 0));

  /* Универсальная страница со списком треков (плейлист, альбом, исполнитель, медиатека) */
  trackPage(o) {
    let ts = o.sortable ? this.sortTracks(o.tracks) : o.tracks; this.list = ts; this.pageCtx = o;
    const total = ts.reduce((s, t) => s + (t.duration || 0), 0);

          ${[['added', 'Дата добавления'], ['title', 'Название'], ['artist', 'Исполнитель'], ['rating', 'Оценка'], ['duration', 'Длительность']].map(([v, n]) => `<option value="${v}" ${this.sort === v ? 'selected' : ''}>${n}</option>`).join('')}</select></label>` : ''}

        : this.rows(ts, o)) : o.smart ? `<div class="empty">${I(o.smart.icon)}<h3>Пока пусто</h3><p>${{ mix: 'Добавьте несколько треков — подборка появится сразу.', top: 'Послушайте музыку — здесь соберётся ваш топ за 30 дней.', rated: 'Ставьте оценки трекам: клик по звёздам в списке, в «Сейчас играет» или клавиши 1–5.', forgotten: 'Здесь появятся треки, которые вы не включали больше месяца.', never: 'Вы уже послушали все треки медиатеки!' }[o.smart.k]}</p></div>`
      : (o.pl ? `<div class="empty">${I('note')}<h3>Плейлист пуст</h3><p>Добавляйте треки через меню «···» или правый клик по треку.</p><button class="btn" data-go="library">Открыть медиатеку</button></div>` : this.emptyUpload())}
      </div>`;
    const playFrom = (k, shuffle) => { if (!ts.length) return; if (shuffle && !Queue.shuffle) Queue.toggleShuffle(); Queue.set(ts.map(t => t.id), k); Player.load(true); };
    $('#pgPlay').onclick = () => { if (Player.track && ts.some(t => t.id === Player.track.id) && Queue.list.join() === ts.map(t => t.id).join()) Player.toggle(); else playFrom(0); };
    $('#pgShuf').onclick = () => playFrom(Math.random() * ts.length | 0, true);

      $('#mixNew') && ($('#mixNew').onclick = () => { Rec.mix(true); this.render(); toast('Подборка обновлена'); });

      const mb = $('.more', r); mb && (mb.onclick = e => { e.stopPropagation(); this.trackMenu(e, Library.get(r.dataset.row), o.pl); });
    });
    this.bindStars(m); this.bindDropZone(); this.markPlaying();
  },
  starsHTML(t) { const r = t.rating || 0;

  /* ---------- Текст песни ---------- */

  async renderLyrics(force) {

        <div class="chips" style="justify-content:center"><button class="pill" id="lyrNet">Найти в интернете</button><button class="pill" id="lyrAdd">Добавить вручную</button></div>

        catch { toast('Нет связи с lrclib.net', 1); b.disabled = false; b.textContent = 'Найти в интернете'; } };

  /* подсветка текущей строки (вызывается каждый кадр, пока открыт «Сейчас играет») */

  syncControls() {

  syncVolume() {

  /* ---------- Очередь (drag & drop для смены порядка) ---------- */
  toggleQueue(on) { const q = $('#qp'); on = on ?? !q.classList.contains('open'); q.classList.toggle('open', on); $('#qBtn').classList.toggle('on', on); if (on) { this.renderQueue(); $('#qClose').focus(); } },
  renderQueue() {
    const box = $('#ql'); if (!$('#qp').classList.contains('open')) return;
    if (!Queue.list.length) { box.innerHTML = `<div class="empty" style="padding:32px 8px"><p>Очередь пуста. Добавьте треки через меню «···».</p></div>`; return; }
    const item = (id, k) => { const t = Library.get(id); if (!t) return '';
      return `<div class="qi ${k === Queue.i ? 'cur' : ''}" draggable="true" data-qk="${k}" tabindex="0" aria-label="${esc(t.title)}, позиция ${k + 1}. Alt+стрелки — переместить">
        <div class="cv" style="${coverCSS(t)}"></div><div style="min-width:0;flex:1"><b class="ell" style="display:block;font-weight:500">${esc(t.title)}</b><span class="muted sm">${esc(t.artist)}</span></div>
        <button class="ib" data-qrm="${k}" aria-label="Убрать из очереди">${I('x')}</button></div>`; };
    const cur = Queue.i >= 0 ? `<h4 class="muted" style="margin:8px">Сейчас играет</h4>${item(Queue.list[Queue.i], Queue.i)}` : '';
    const next = Queue.list.map((id, k) => k > Queue.i ? item(id, k) : '').join('');
    box.innerHTML = cur + (next ? `<h4 class="muted" style="margin:16px 8px 8px">Далее</h4>${next}` : '');
    let from = null;
    $$('.qi', box).forEach(el => {
      const k = +el.dataset.qk;
      el.ondragstart = e => { from = k; el.classList.add('drag'); e.dataTransfer.effectAllowed = 'move'; e.dataTransfer.setData('text/x-queue', k); };
      el.ondragend = () => el.classList.remove('drag');
      el.ondragover = e => { if (from === null) return; e.preventDefault(); e.stopPropagation(); el.classList.add('over'); };
      el.ondragleave = () => el.classList.remove('over');
      el.ondrop = e => { e.preventDefault(); e.stopPropagation(); el.classList.remove('over'); if (from !== null && from !== k) Queue.move(from, from < k ? k - 1 : k); from = null; };
      el.ondblclick = () => { Queue.i = k; Player.load(true); };
      el.onkeydown = e => { if (e.key === 'Enter') { Queue.i = k; Player.load(true); }
        if (e.altKey && (e.key === 'ArrowUp' || e.key === 'ArrowDown')) { e.preventDefault(); const to = k + (e.key === 'ArrowUp' ? -1 : 1); if (to >= 0 && to < Queue.list.length) { Queue.move(k, to); $(`[data-qk="${to}"]`)?.focus(); } } };

  },
  toggleFull(on) { const f = $('#full'); on = on ?? !f.classList.contains('open'); f.classList.toggle('open', on); if (on) { $('#fClose').focus(); if (this.lyrMode) this.renderLyrics(true); } },

  /* ---------- Drag & drop файлов и папок ---------- */
  bindDropZone() { /* зона подсвечивается глобальным обработчиком */ },
  dnd() {
    let depth = 0; const mask = $('#dragmask'), isFiles = e => [...(e.dataTransfer?.types || [])].includes('Files');
    window.addEventListener('dragenter', e => { if (!isFiles(e)) return; depth++; mask.classList.add('hot'); });
    window.addEventListener('dragleave', e => { if (!isFiles(e)) return; if (--depth <= 0) { depth = 0; mask.classList.remove('hot'); } });
    window.addEventListener('dragover', e => { if (isFiles(e)) e.preventDefault(); });
    window.addEventListener('drop', async e => {
      if (!isFiles(e)) return; e.preventDefault(); depth = 0; mask.classList.remove('hot');
      const items = [...e.dataTransfer.items].map(i => i.webkitGetAsEntry?.()).filter(Boolean);
      const files = [];
      const walk = entry => new Promise(res => {
        if (entry.isFile) entry.file(f => { files.push(f); res(); }, res);
        else if (entry.isDirectory) { const r = entry.createReader(); const read = () => r.readEntries(async es => { if (!es.length) return res(); for (const x of es) await walk(x); read(); }, res); read(); }
        else res();
      });
      if (items.length) for (const it of items) await walk(it); else files.push(...e.dataTransfer.files);
      Library.addFiles(files);
    });
  },

  /* ---------- Горячие клавиши ---------- */
  keys() {
    document.addEventListener('keydown', e => {
      const tag = e.target.tagName; if (['INPUT', 'TEXTAREA', 'SELECT'].includes(tag) && e.target.type !== 'range') return;
      if ($('.modal')) return;
      const k = e.key, a = Player.el;
      if (k === ' ' && !['BUTTON'].includes(tag)) { e.preventDefault(); Player.toggle(); }
      else if (k === 'ArrowRight' && (e.ctrlKey || e.metaKey)) { e.preventDefault(); Player.next(); }
      else if (k === 'ArrowLeft' && (e.ctrlKey || e.metaKey)) { e.preventDefault(); Player.prev(); }
      else if (k === 'ArrowRight' && tag !== 'INPUT' && !e.altKey) { e.preventDefault(); Player.seek(a.currentTime + 5); }
      else if (k === 'ArrowLeft' && tag !== 'INPUT' && !e.altKey) { e.preventDefault(); Player.seek(a.currentTime - 5); }
      else if (k === 'ArrowUp' && tag !== 'INPUT' && !e.altKey && !e.target.closest('#menu')) { e.preventDefault(); Player.setVolume(Player.volume + 0.05); }
      else if (k === 'ArrowDown' && tag !== 'INPUT' && !e.altKey && !e.target.closest('#menu')) { e.preventDefault(); Player.setVolume(Player.volume - 0.05); }
      else if (/^[mь]$/i.test(k)) Player.toggleMute();
      else if (/^[sы]$/i.test(k)) Queue.toggleShuffle();
      else if (/^[rк]$/i.test(k)) Queue.cycleRepeat();
      else if (/^[lд]$/i.test(k)) { if (!$('#full').classList.contains('open')) { this.toggleLyrics(true); this.toggleFull(true); } else this.toggleLyrics(); }
      else if (/^[0-5]$/.test(k) && !e.ctrlKey && !e.altKey && !e.metaKey && Player.track) Library.rate(Player.track.id, +k);

    });
  },

  /* ---------- Визуализатор спектра (canvas) ---------- */
  viz() {
    const c = $('#viz'), x = c.getContext('2d'); let data;
    const draw = () => {
      requestAnimationFrame(draw);
      if (!$('#full').classList.contains('open')) return;
      this.lyrTick();
      const w = c.width = c.clientWidth * devicePixelRatio, h = c.height = c.clientHeight * devicePixelRatio; x.clearRect(0, 0, w, h);
      const an = Player.analyser; if (!an) return; data = data || new Uint8Array(an.frequencyBinCount); an.getByteFrequencyData(data);

        x.fillStyle = ac; x.globalAlpha = 0.4 + v * 0.6; x.fillRect(i * bw + 1, h - bh, bw - 2, bh); }

  },
};

/* =====================================================================
   App — возможности версии для Windows (preload.js → window.mtApp):
   «Открыть с помощью MyTunes» и автообновление. В браузере не используется.
   ===================================================================== */
const App = {
  api: window.mtApp || null, version: '', status: 'Обновления проверяются автоматически при запуске',
  async init() {
    const A = this.api; if (!A) return;
    this.version = await A.version();
    A.onOpenFiles(list => this.openFiles(list)); A.onUpdate(u => this.onUpdate(u));
    const first = await A.ready(); if (first && first.length) this.openFiles(first);
  },
  /* файлы из проводника: уже известные берём из медиатеки, новые добавляем; затем играем по порядку */
  async openFiles(list) {
    const files = list.map(f => new File([f.data], f.name, { type: /\.lrc$/i.test(f.name) ? 'text/plain' : '' }));
    const audio = files.filter(f => !/\.lrc$/i.test(f.name));
    const find = f => Library.list().find(t => t.fileName === f.name && t.size === f.size);
    const fresh = files.filter(f => /\.lrc$/i.test(f.name) || !find(f));
    if (fresh.length) await Library.addFiles(fresh);
    const ids = audio.map(f => find(f)?.id).filter(Boolean); if (!ids.length) return;
    Queue.set(ids); await Player.load(true);
  },
  onUpdate(u) {
    const S = { checking: 'Проверяем обновления…', none: 'Установлена последняя версия', available: `Найдена версия ${u.version}, загружаем…`,
      downloading: `Загрузка обновления… ${Math.round(u.percent || 0)}%`, ready: `Версия ${u.version} загружена — установится при перезапуске`,
      portable: `Доступна версия ${u.version} — скачайте её со страницы релиза`, error: 'Не удалось проверить обновления (нет интернета?)', dev: 'Обновления работают только в собранном приложении' };
    this.status = S[u.state] || this.status; const s = $('#updS'); if (s) s.textContent = this.status;
    if (u.state === 'ready' || u.state === 'portable') this.banner(u);
  },
  banner(u) {
    $('#upd')?.remove(); const d = document.createElement('div'); d.id = 'upd'; d.setAttribute('role', 'status');
    d.innerHTML = `<span>Доступна MyTunes <b>${esc(u.version)}</b></span>${u.state === 'ready' ? '<button class="btn" data-u="install">Перезапустить и обновить</button>' : '<button class="btn" data-u="open">Скачать</button>'}<button class="ib" data-u="x" aria-label="Напомнить позже" title="Позже">${I('x')}</button>`;
    document.body.append(d);
    d.onclick = e => { const b = e.target.closest('[data-u]'); if (!b) return; if (b.dataset.u === 'install') { Stats.flush(); this.api.install(); } else if (b.dataset.u === 'open') this.api.openUrl(u.url); d.remove(); };
  },
};

/* Тема и акцент (с автоматическим контрастным цветом текста на акценте) */
function applyTheme(theme, accent) {
  theme = theme || LS.get('theme', 'dark'); accent = accent || LS.get('accent', '#1DB954');
  LS.set('theme', theme); LS.set('accent', accent);
  document.documentElement.dataset.theme = theme;
  document.documentElement.style.setProperty('--ac', accent);
  const n = parseInt(accent.slice(1), 16), L = (0.299 * (n >> 16) + 0.587 * (n >> 8 & 255) + 0.114 * (n & 255)) / 255;
  document.documentElement.style.setProperty('--acTx', L > 0.5 ? '#000' : '#fff');
}

/* =====================================================================
   Запуск
   ===================================================================== */
(async function boot() {
  applyTheme(); Stats.init(); UI.init(); Player.init(); UI.render(); UI.syncVolume();
  try { await Storage.open(); await Library.load(); }
  catch (e) { toast('IndexedDB недоступна — треки не будут сохраняться', 1); console.error(e); }
  UI.loading = false;
  Queue.restore(); UI.renderSidebar();
  // восстановление маршрута из адреса
  const [r, a] = location.hash.slice(1).split('/'); UI.go(r || 'home', a ? decodeURIComponent(a) : null, false);
  window.onpopstate = e => UI.go(e.state?.route || 'home', e.state?.arg, false);
  // восстановление текущего трека и позиции (без автозапуска)
  if (Queue.current()) await Player.load(false, LS.get('pos', 0));
  UI.syncTrack();
  App.init().catch(e => console.error(e));
})();
</script>
